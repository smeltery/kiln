name: Publish

# Build + publish the kiln image to GitHub Container Registry
# (ghcr.io/<owner>/kiln).
#
# Self-contained: multi-arch buildx, GHCR auth via the workflow token, cosign
# keyless signing (GitHub OIDC), and a BuildKit SBOM + provenance attestation.
# No external registry or signing key required.

on:
  push:
    tags: ['v*']
  schedule:
    # Sunday 09:00 UTC weekly rebuild — picks up Wolfi APKINDEX drift and
    # security updates without anyone having to push. Each rebuild is tagged
    # by sha + date, so it's a distinct immutable artifact.
    - cron: '0 9 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  docker:
    name: Build + publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write     # push to GHCR
      id-token: write     # cosign keyless (GitHub OIDC)
      attestations: write # build provenance attestation
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=raw,value=latest,enable={{is_default_branch}}
            # Drop-in aliases for catthehacker's tag scheme so kiln can be
            # swapped 1:1 into act runner maps (e.g. smeltery/bellows). kiln
            # is a single image today, so these all point at the same digest;
            # the version-suffixed tags exist so consumers can pin by ubuntu
            # series and keep working if kiln ever splits per-version builds.
            type=raw,value=act-latest,enable={{is_default_branch}}
            type=raw,value=ubuntu-latest,enable={{is_default_branch}}
            type=raw,value=ubuntu-24.04,enable={{is_default_branch}}
            type=raw,value=ubuntu-22.04,enable={{is_default_branch}}

      - name: Build + push (multi-arch)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Default `direct` mode builds FROM cgr.dev/chainguard/wolfi-base.
          # Override with `build-args: BUILD_MODE=bootstrap` only if cgr.dev
          # is blocked in your environment.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
