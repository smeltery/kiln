name: Publish

# Build + publish the kiln image to GitHub Container Registry
# (ghcr.io/<owner>/kiln).
#
# Self-contained: multi-arch buildx, GHCR auth via the workflow token, cosign
# keyless signing (GitHub OIDC), and a BuildKit SBOM + provenance attestation.
# No external registry or signing key required.

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # Sunday 09:00 UTC weekly rebuild — picks up Wolfi APKINDEX drift and
    # security updates without anyone having to push. Each rebuild is tagged
    # by sha + date, so it's a distinct immutable artifact.
    - cron: '0 9 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  docker:
    name: Build + publish
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write     # push to GHCR
      id-token: write     # cosign keyless (GitHub OIDC)
      attestations: write # build provenance attestation
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=raw,value=latest,enable={{is_default_branch}}
            # Drop-in aliases for catthehacker's tag scheme so kiln can be
            # swapped 1:1 into act runner maps (e.g. dotbrains/bellows). kiln
            # is a single image today, so these all point at the same digest;
            # the version-suffixed tags exist so consumers can pin by ubuntu
            # series and keep working if kiln ever splits per-version builds.
            type=raw,value=act-latest,enable={{is_default_branch}}
            type=raw,value=ubuntu-latest,enable={{is_default_branch}}
            type=raw,value=ubuntu-24.04,enable={{is_default_branch}}
            type=raw,value=ubuntu-22.04,enable={{is_default_branch}}

      - name: Build + push (multi-arch)
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Default `direct` mode builds FROM cgr.dev/chainguard/wolfi-base.
          # Override with `build-args: BUILD_MODE=bootstrap` only if cgr.dev
          # is blocked in your environment.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
