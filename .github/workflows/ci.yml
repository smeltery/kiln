name: CI

# PR + main-branch validation. Two jobs:
#   lint           — hadolint (Dockerfile), actionlint (workflows), shellcheck (scripts)
#   build          — builds the image locally (single-arch, no push) so the
#                    Wolfi base + install sequence is exercised on every change,
#                    then installs nektos/act and runs .github/workflows/smoke.yml
#                    against the freshly-built image in the same job (the image
#                    stays in the local docker daemon, so no cross-job artifact
#                    transfer is needed)
#
# Publish is intentionally a separate workflow — CI never pushes.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: hadolint (Dockerfile)
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile
      - name: actionlint (workflows)
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
      - name: shellcheck (scripts)
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # v2.0.0
        with:
          scandir: ./scripts

  build:
    name: Build + smoke (act)
    needs: lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image (single arch, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: kiln:ci
          # Builds in the default `direct` mode (FROM cgr.dev/chainguard/wolfi-base),
          # which is publicly pullable. To exercise the bootstrap fallback instead,
          # add `build-args: BUILD_MODE=bootstrap`.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Build + smoke run in one job so the freshly-built kiln:ci image is
      # already in the local docker daemon — no upload/download-artifact hop
      # (which also keeps CI off GitHub's artifact storage quota).
      - name: Install nektos/act
        run: |
          curl -fsSL https://raw.githubusercontent.com/nektos/act/master/install.sh \
            | sudo bash -s -- -b /usr/local/bin
          act --version
      - name: Run smoke workflow against the built image
        run: |
          # --pull=false tells act to use the locally-loaded image instead
          # of trying to pull kiln:ci from a remote registry
          # (which doesn't exist — we just `docker load`'d it).
          act \
            --pull=false \
            --workflows .github/workflows/smoke.yml \
            -P ubuntu-latest=kiln:ci \
            -P ubuntu-24.04=kiln:ci \
            -P ubuntu-22.04=kiln:ci \
            --container-architecture linux/amd64
